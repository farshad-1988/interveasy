services:
  postgres:
    image: postgres:16
    container_name: nest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vR8sqN4dzT7apL2gwX9hkM6
      POSTGRES_DB: interveasy
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d users']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
